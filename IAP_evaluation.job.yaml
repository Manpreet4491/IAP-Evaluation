resources:
  jobs:
    IAP_evaluation:
      name: IAP_evaluation
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/manpreetsingh@cyntexa.com/IAP-Evaluation/02_ingestion
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 15000
          disable_auto_optimization: false
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/manpreetsingh@cyntexa.com/IAP-Evaluation/03_cleaning
            source: WORKSPACE
        - task_key: gold_model
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: /Workspace/Users/manpreetsingh@cyntexa.com/IAP-Evaluation/04_gold_layer
            source: WORKSPACE
        - task_key: data_quality_checks
          depends_on:
            - task_key: gold_model
          notebook_task:
            notebook_path: /Workspace/Users/manpreetsingh@cyntexa.com/IAP-Evaluation/05_data_quality
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: dev
      performance_target: PERFORMANCE_OPTIMIZED
